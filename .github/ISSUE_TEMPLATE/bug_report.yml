name: 버그 신고
description: 도구가 예상과 다르게 동작할 때
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 버그를 신고해 주셔서 고맙습니다. 서비스키 같은 민감 정보는 절대 포함하지 마세요.
  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: 기존 이슈를 검색했고, 중복되는 신고가 없음을 확인했습니다.
          required: true
        - label: 최신 버전에서 재현되는지 확인했습니다.
          required: true
  - type: input
    id: tool
    attributes:
      label: 도구, 서비스
      description: 어떤 도구에서 발생했나요
      placeholder: "@opendata-kr/<service>-mcp"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 사용 중인 패키지 버전
      placeholder: "예: 1.2.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 무엇을 했을 때 발생하는지 단계별로
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 에러 메시지가 있다면 함께 붙여 주세요(서비스키 제거 후)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: 관련 로그나 스택 트레이스가 있다면 붙여 주세요(서비스키 등 민감 정보 제거 후). 자동으로 코드 블록으로 표시됩니다.
      render: shell
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 버전은 정확히 적어 주세요
      placeholder: |
        - OS:
        - Node.js:
        - npm:
        - MCP 클라이언트(Claude Desktop, Claude Code, Cursor 등)와 버전:
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: 행동 강령
      options:
        - label: 이 프로젝트의 [행동 강령](https://github.com/opendata-kr/.github/blob/main/CODE_OF_CONDUCT.md)에 동의합니다.
          required: true
